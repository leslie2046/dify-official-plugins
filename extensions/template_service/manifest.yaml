version: 0.0.1
type: plugin
author: "custom"
name: "template_service"
label:
  en_US: "Explore Template Service"
  zh_Hans: "探索模板服务"
  ja_JP: "探索テンプレートサービス"
  pt_BR: "Serviço de Modelos de Exploração"
description:
  en_US: "Provides API endpoints to serve explore app templates for Dify. Supports listing apps, getting app details, and managing templates."
  zh_Hans: "为 Dify 提供探索应用模板的 API 接口。支持列出应用、获取应用详情和管理模板。"
  ja_JP: "Dify向けの探索アプリテンプレートを提供するAPIエンドポイント。アプリの一覧表示、詳細取得、テンプレート管理をサポート。"
  pt_BR: "Fornece endpoints de API para servir modelos de aplicativos de exploração para o Dify. Suporta listagem de apps, detalhes e gerenciamento de modelos."
created_at: 2026-01-09T21:51:44+08:00
icon: icon.svg
resource:
  memory: 1048576
  permission:
    endpoint:
      enabled: true
    storage:
      enabled: true
      size: 104857600  # 100MB for storing templates
plugins:
  endpoints:
    - "group/template_service.yaml"
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
