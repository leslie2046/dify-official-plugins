model: nex-agi/Nex-N2-Pro
label:
  zh_Hans: nex-agi/Nex-N2-Pro
  en_US: nex-agi/Nex-N2-Pro
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - agent-thought
  - vision
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 256000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 256000
  - name: temperature
    use_template: temperature
    default: 0.7
  - name: top_p
    use_template: top_p
  - name: top_k
    label:
      zh_Hans: Top k
      en_US: Top k
    type: int
    default: 50
    min: 0
    max: 100
    required: false
  - name: frequency_penalty
    use_template: frequency_penalty
    type: float
    default: 0.0
    min: -2.0
    max: 2.0
pricing:
  input: "1.75"
  output: "7"
  unit: "0.000001"
  currency: RMB
